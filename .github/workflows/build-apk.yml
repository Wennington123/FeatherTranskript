name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do app (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK e ferramentas
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Definir versão
        id: version
        working-directory: mobile
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=apk-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=FeatherTranskript-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        working-directory: mobile
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Gerar projeto Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Ajustar Gradle
        working-directory: mobile
        run: |
          sed -i 's/-Xmx2048m -XX:MaxMetaspaceSize=512m/-Xmx4g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,armeabi-v7a/' android/gradle.properties
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Configurar assinatura
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storeType "PKCS12"
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        working-directory: mobile
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/${{ steps.version.outputs.apk }}"
          ls -lh ../dist

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FeatherTranskript v${{ steps.version.outputs.value }}
          body: |
            APK do FeatherTranskript v${{ steps.version.outputs.value }} (build ${{ github.run_number }}).

            - Android 7.0+ (minSdk 24)
            - APK assinado, pronto para instalação direta
            - Transcrição 100% on-device
          files: dist/*.apk
          generate_release_notes: true
